services:
  postgres:
    image: postgres:17
    container_name: accounting_db
    environment:
      POSTGRES_USER: admin_accountproducts
      POSTGRES_PASSWORD: Qwerty123
      POSTGRES_DB: AccountingProducts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_accountproducts"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: AccountingProducts.WEB/Dockerfile
    container_name: accounting_backend
    ports:
      - "7006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=AccountingProducts;Username=admin_accountproducts;Password=Qwerty123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./AccountingProducts.React
      dockerfile: Dockerfile
    container_name: accounting_frontend
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: accounting_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge